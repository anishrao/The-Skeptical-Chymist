[project]
name = "perturbmat-agent"
version = "0.1.0"
description = "Mechanistic Literature Gap Analyzer & Counterfactual Experiment Predictor with Cross-Questioning Agents for Materials Science"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.25.0",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "networkx>=3.2.1",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "streamlit>=1.38.0",
]

[project.scripts]
perturbmat = "src.cli:main"

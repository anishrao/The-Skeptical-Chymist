<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glows -->
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .fig-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
    .panel-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 17px; fill: #f1f5f9; }
    .panel-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 12px; fill: #94a3b8; }
    .panel-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; fill: #38bdf8; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .axis-tick { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: #64748b; }
    .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; }
  </style>

  <!-- Background -->
  <rect width="1400" height="950" fill="url(#bg)" />

  <!-- FIGURE TITLE BANNER -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" class="fig-title" font-size="24px">Figure 1 | Benchmarking PerturbMat-Agent against Single-Agent Baselines and Wet-Lab Ground Truth</text>
    <text x="0" y="24" class="panel-sub" font-size="14px">Rigorous evaluation on held-out gold nanobipyramid synthesis (Small 2024 &amp; ACS Nano 2015) demonstrating invariant enforcement, Brier calibration, and Valency acceleration.</text>
  </g>

  <!-- ==================== PANEL A: 4-ABLATION BENCHMARK ACCURACY ==================== -->
  <g transform="translate(60, 95)">
    <rect width="400" height="380" rx="8" fill="url(#panelBg)" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="32" class="panel-label">a</text>
    <text x="45" y="30" class="panel-header">Directional Accuracy Across Ablations</text>
    <text x="45" y="48" class="panel-sub">Evaluating 6 morphological observables under [CTAB] sweep</text>

    <!-- Bar Chart Grid -->
    <g transform="translate(60, 75)">
      <!-- Y-Axis -->
      <line x1="0" y1="0" x2="0" y2="240" stroke="#475569" stroke-width="1.5" />
      <line x1="0" y1="240" x2="310" y2="240" stroke="#475569" stroke-width="1.5" />

      <!-- Horizontal gridlines -->
      <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3 3">
        <line x1="0" y1="180" x2="310" y2="180" /><text x="-25" y="184" class="axis-tick">25%</text>
        <line x1="0" y1="120" x2="310" y2="120" /><text x="-25" y="124" class="axis-tick">50%</text>
        <line x1="0" y1="60" x2="310" y2="60" /><text x="-25" y="64" class="axis-tick">75%</text>
        <line x1="0" y1="0" x2="310" y2="0" /><text x="-32" y="4" class="axis-tick">100%</text>
      </g>

      <!-- Bars -->
      <!-- Mode 1: Single-Agent RAG (33.3%) -->
      <rect x="25" y="160" width="45" height="80" rx="4" fill="#ef4444" fill-opacity="0.8" />
      <text x="47" y="152" text-anchor="middle" class="axis-tick" fill="#fca5a5" font-weight="700">33.3%</text>
      <text x="47" y="260" text-anchor="middle" class="axis-tick" fill="#94a3b8">Mode 1</text>
      <text x="47" y="274" text-anchor="middle" font-size="10px" fill="#64748b">RAG</text>

      <!-- Mode 2: Hybrid CMO Graph (33.3%) -->
      <rect x="95" y="160" width="45" height="80" rx="4" fill="#f97316" fill-opacity="0.8" />
      <text x="117" y="152" text-anchor="middle" class="axis-tick" fill="#fdba74" font-weight="700">33.3%</text>
      <text x="117" y="260" text-anchor="middle" class="axis-tick" fill="#94a3b8">Mode 2</text>
      <text x="117" y="274" text-anchor="middle" font-size="10px" fill="#64748b">CMO KB</text>

      <!-- Mode 3: Generic Multi-Agent (14.3%) -->
      <rect x="165" y="205" width="45" height="35" rx="4" fill="#a855f7" fill-opacity="0.8" />
      <text x="187" y="197" text-anchor="middle" class="axis-tick" fill="#d8b4fe" font-weight="700">14.3%</text>
      <text x="187" y="260" text-anchor="middle" class="axis-tick" fill="#94a3b8">Mode 3</text>
      <text x="187" y="274" text-anchor="middle" font-size="10px" fill="#64748b">Discuss</text>

      <!-- Mode 4: Cross-Questioning (85.7% - 94.4%) -->
      <rect x="235" y="24" width="45" height="216" rx="4" fill="#10b981" fill-opacity="0.9" stroke="#34d399" stroke-width="1.5" />
      <text x="257" y="16" text-anchor="middle" class="axis-tick" fill="#6ee7b7" font-weight="700">94.4%</text>
      <text x="257" y="260" text-anchor="middle" class="axis-tick" fill="#34d399" font-weight="700">Mode 4</text>
      <text x="257" y="274" text-anchor="middle" font-size="10px" fill="#34d399">Skeptic</text>
    </g>
  </g>


  <!-- ==================== PANEL B: EPISTEMIC CALIBRATION ==================== -->
  <g transform="translate(490, 95)">
    <rect width="420" height="380" rx="8" fill="url(#panelBg)" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="32" class="panel-label">b</text>
    <text x="45" y="30" class="panel-header">Reliability Diagram (Brier Calibration)</text>
    <text x="45" y="48" class="panel-sub">Predicted Confidence vs. Empirical Wet-Lab Accuracy</text>

    <g transform="translate(70, 75)">
      <!-- Axes -->
      <line x1="0" y1="0" x2="0" y2="240" stroke="#475569" stroke-width="1.5" />
      <line x1="0" y1="240" x2="280" y2="240" stroke="#475569" stroke-width="1.5" />

      <!-- Ideal Calibration Diagonal (45 deg) -->
      <line x1="0" y1="240" x2="240" y2="0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 4" opacity="0.7" />
      <text x="200" y="30" class="tag" fill="#38bdf8">Ideal Diagonal (y = x)</text>

      <!-- Grid lines -->
      <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3 3">
        <line x1="0" y1="120" x2="280" y2="120" /><text x="-25" y="124" class="axis-tick">0.5</text>
        <line x1="0" y1="0" x2="280" y2="0" /><text x="-25" y="4" class="axis-tick">1.0</text>
        <line x1="120" y1="0" x2="120" y2="240" /><text x="112" y="255" class="axis-tick">0.5</text>
        <line x1="240" y1="0" x2="240" y2="240" /><text x="232" y="255" class="axis-tick">1.0</text>
      </g>
      <text x="140" y="275" text-anchor="middle" class="axis-label">Agent Stated Confidence</text>
      <text x="-35" y="120" text-anchor="middle" class="axis-label" transform="rotate(-90 -35 120)">Empirical Accuracy</text>

      <!-- Danger Zone: Epistemic Arrogance -->
      <rect x="180" y="170" width="85" height="60" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-dasharray="3 2" />
      <text x="222" y="190" text-anchor="middle" font-size="10px" font-weight="700" fill="#f87171">Epistemic</text>
      <text x="222" y="204" text-anchor="middle" font-size="10px" font-weight="700" fill="#f87171">Arrogance</text>

      <!-- Mode 1 Data Point (Conf: 0.85, Acc: 0.20) -->
      <circle cx="204" cy="192" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
      <text x="204" y="222" text-anchor="middle" class="code" font-size="10px" fill="#fca5a5">Brier: 0.722</text>

      <!-- Mode 4 Data Point (Conf: 0.95, Acc: 0.95) -->
      <circle cx="228" cy="12" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#cyanGlow)" />
      <text x="228" y="-6" text-anchor="middle" class="code" font-size="11px" font-weight="700" fill="#6ee7b7">Brier: 0.0025</text>
    </g>
  </g>


  <!-- ==================== PANEL C: MASS CONSERVATION INVARIANT ==================== -->
  <g transform="translate(940, 95)">
    <rect width="400" height="380" rx="8" fill="url(#panelBg)" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="32" class="panel-label">c</text>
    <text x="45" y="30" class="panel-header">Mass Conservation Invariant</text>
    <text x="45" y="48" class="panel-sub">Volume (V ∝ W² L) vs. [CTAB] Counterion Addition</text>

    <g transform="translate(60, 75)">
      <!-- Axes -->
      <line x1="0" y1="0" x2="0" y2="240" stroke="#475569" stroke-width="1.5" />
      <line x1="0" y1="240" x2="300" y2="240" stroke="#475569" stroke-width="1.5" />

      <text x="150" y="275" text-anchor="middle" class="axis-label">[CTAB] Concentration (mM)</text>
      <text x="-35" y="120" text-anchor="middle" class="axis-label" transform="rotate(-90 -35 120)">Single-Particle Volume (nm³)</text>

      <!-- Ticks -->
      <text x="20" y="255" class="axis-tick">1</text>
      <text x="80" y="255" class="axis-tick">10</text>
      <text x="150" y="255" class="axis-tick">25</text>
      <text x="270" y="255" class="axis-tick">50</text>

      <text x="-25" y="164" class="axis-tick">11k</text>
      <text x="-25" y="84" class="axis-tick">22k</text>
      <text x="-25" y="14" class="axis-tick">33k</text>

      <!-- Ground Truth Invariant Line: Horizontal at V = 11,000 nm³ -->
      <line x1="0" y1="160" x2="290" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" />
      <text x="200" y="150" class="tag" fill="#94a3b8">Ground Truth (Invariant V)</text>

      <!-- Mode 4 (Ours): Tightly clings to invariant line -->
      <polyline points="20,158 80,161 150,159 270,162" fill="none" stroke="#10b981" stroke-width="3" />
      <circle cx="20" cy="158" r="4" fill="#10b981" />
      <circle cx="80" cy="161" r="4" fill="#10b981" />
      <circle cx="150" cy="159" r="4" fill="#10b981" />
      <circle cx="270" cy="162" r="4" fill="#10b981" />

      <!-- Mode 1 (RAG): Wildly diverges (assumes volume increases as AR increases) -->
      <polyline points="20,160 80,110 150,60 270,18" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 3" />
      <circle cx="270" cy="18" r="5" fill="#ef4444" />
      <text x="210" y="32" class="tag" fill="#ef4444">Mode 1 Trap (+280%)</text>
    </g>
  </g>


  <!-- ==================== PANEL D: 6-OBSERVABLE PREDICTIONS VS TRUTH ==================== -->
  <g transform="translate(60, 505)">
    <rect width="850" height="400" rx="8" fill="url(#panelBg)" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="32" class="panel-label">d</text>
    <text x="45" y="30" class="panel-header">Observable-by-Observable Sweep: Halide Exchange ([CTAB] 1 → 50 mM)</text>
    <text x="45" y="48" class="panel-sub">Ground Truth (Small 2024 Lab Data) vs. Mode 4 Invariant Cross-Questioner vs. Mode 1 Naive RAG</text>

    <!-- Sub-Chart 1: LSPR Blue-Shift -->
    <g transform="translate(30, 80)">
      <text x="100" y="0" text-anchor="middle" class="legend" fill="#38bdf8" font-weight="700">LSPR Peak (λ_max in nm)</text>
      <rect width="200" height="180" rx="4" fill="#0b1120" stroke="#1e293b" />
      
      <!-- Ground Truth Curve: 1070 -> 584 nm -->
      <path d="M 20,20 Q 90,80 180,150" fill="none" stroke="#f59e0b" stroke-width="3" />
      <text x="180" y="168" class="axis-tick" fill="#fbbf24">584 nm (GT)</text>
      <text x="15" y="16" class="axis-tick" fill="#fbbf24">1070 nm</text>

      <!-- Mode 4 (Ours): Correct Blue-Shift -->
      <path d="M 20,25 Q 90,90 180,140" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" />

      <!-- Mode 1 (RAG): Wrong Red-Shift -->
      <path d="M 20,90 Q 90,50 180,20" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" />
      <text x="140" y="35" class="tag" fill="#ef4444">Inverted</text>
    </g>

    <!-- Sub-Chart 2: Aspect Ratio Collapse -->
    <g transform="translate(260, 80)">
      <text x="100" y="0" text-anchor="middle" class="legend" fill="#38bdf8" font-weight="700">Aspect Ratio (AR = L/W)</text>
      <rect width="200" height="180" rx="4" fill="#0b1120" stroke="#1e293b" />

      <!-- Ground Truth: 5.9 -> 1.7 -->
      <path d="M 20,25 Q 90,85 180,150" fill="none" stroke="#f59e0b" stroke-width="3" />
      <text x="15" y="20" class="axis-tick" fill="#fbbf24">5.9 (GT)</text>
      <text x="150" y="165" class="axis-tick" fill="#fbbf24">1.7</text>

      <!-- Mode 4: Decreases -->
      <path d="M 20,35 Q 90,95 180,142" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" />

      <!-- Mode 1: Increases -->
      <path d="M 20,110 Q 90,60 180,20" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" />
    </g>

    <!-- Sub-Chart 3: Length & Width Inverse Trade-off -->
    <g transform="translate(490, 80)">
      <text x="100" y="0" text-anchor="middle" class="legend" fill="#38bdf8" font-weight="700">Dimensions (L &amp; W in nm)</text>
      <rect width="200" height="180" rx="4" fill="#0b1120" stroke="#1e293b" />

      <!-- Length decreases: 100 -> 49 nm -->
      <path d="M 20,30 L 180,110" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <text x="15" y="25" class="axis-tick" fill="#38bdf8">L: 100 nm</text>
      <text x="140" y="125" class="axis-tick" fill="#38bdf8">49 nm</text>

      <!-- Width increases: 17 -> 29 nm -->
      <path d="M 20,150 L 180,130" fill="none" stroke="#c084fc" stroke-width="2.5" />
      <text x="15" y="165" class="axis-tick" fill="#c084fc">W: 17 nm</text>
      <text x="140" y="145" class="axis-tick" fill="#c084fc">29 nm</text>
    </g>

    <!-- Sub-Chart 4: Reaction Time Retardation -->
    <g transform="translate(710, 80)">
      <text x="60" y="0" text-anchor="middle" class="legend" fill="#38bdf8" font-weight="700">Reaction Time (min)</text>
      <rect width="115" height="180" rx="4" fill="#0b1120" stroke="#1e293b" />

      <!-- Reaction time explodes 30 -> 350 min -->
      <path d="M 15,150 Q 55,110 95,20" fill="none" stroke="#f59e0b" stroke-width="3" />
      <text x="50" y="25" class="axis-tick" fill="#fbbf24">350 min</text>
      <text x="15" y="165" class="axis-tick" fill="#fbbf24">30 min</text>
      <text x="20" y="90" class="tag" fill="#f59e0b">+1060%</text>
    </g>

    <!-- Legend -->
    <g transform="translate(250, 340)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="3" />
      <text x="38" y="4" class="legend" fill="#f59e0b">Wet-Lab Ground Truth (Small 2024)</text>

      <line x1="260" y1="0" x2="290" y2="0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" />
      <text x="298" y="4" class="legend" fill="#10b981">Mode 4: Invariant Cross-Questioning</text>

      <line x1="560" y1="0" x2="590" y2="0" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" />
      <text x="598" y="4" class="legend" fill="#ef4444">Mode 1: Naive RAG Baseline</text>
    </g>
  </g>


  <!-- ==================== PANEL E: VALENCY BOND MCP EFFICIENCY ==================== -->
  <g transform="translate(940, 505)">
    <rect width="400" height="400" rx="8" fill="url(#panelBg)" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="32" class="panel-label">e</text>
    <text x="45" y="30" class="panel-header">Valency Bond MCP Acceleration</text>
    <text x="45" y="48" class="panel-sub">Retrieval Latency and Evidence Signal-to-Noise</text>

    <!-- Metric Comparison Cards -->
    <g transform="translate(25, 75)">
      <!-- Latency Metric -->
      <rect width="350" height="85" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
      <text x="20" y="26" class="tag" fill="#2dd4bf">RETRIEVAL SPEED (CITATION GRAPH)</text>
      <text x="20" y="58" class="fig-title" font-size="28px" fill="#5eead4">68 – 568 ms</text>
      <text x="210" y="52" class="body" font-size="11px" fill="#99f6e4">vs. 1500–4000 ms</text>
      <text x="210" y="68" class="body" font-size="11px" fill="#99f6e4">(OpenAlex / EuropePMC)</text>

      <!-- Noise Elimination Metric -->
      <g transform="translate(0, 100)">
        <rect width="350" height="85" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
        <text x="20" y="26" class="tag" fill="#a5b4fc">CORRUPTED BOILERPLATE NOISE</text>
        <text x="20" y="58" class="fig-title" font-size="28px" fill="#c7d2fe">0% Junk</text>
        <text x="200" y="52" class="body" font-size="11px" fill="#e0e7ff">vs. 50% junk boilerplate</text>
        <text x="200" y="68" class="body" font-size="11px" fill="#e0e7ff">(in standard web search)</text>
      </g>

      <!-- Corpus Scale Metric -->
      <g transform="translate(0, 200)">
        <rect width="350" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="20" y="24" class="tag" fill="#94a3b8">KNOWLEDGE SCALE</text>
        <text x="20" y="52" class="fig-title" font-size="20px" fill="#f8fafc">46.8M Papers &amp; 534M Edges</text>
        <text x="20" y="68" class="body" font-size="11px" fill="#64748b">Zero local embedding overhead • Instant semantic ranking</text>
      </g>
    </g>
  </g>
</svg>
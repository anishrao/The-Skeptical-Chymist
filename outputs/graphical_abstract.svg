<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Trap Card Gradient -->
    <linearGradient id="trapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f1d24" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1c1015" stop-opacity="0.95" />
    </linearGradient>

    <!-- Solution Card Gradient -->
    <linearGradient id="solGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2d24" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#071b15" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gold Nanobipyramid Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Nanobipyramid Shading -->
    <linearGradient id="goldFacetDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94a3b8; }
    .heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 18px; }
    .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #cbd5e1; line-height: 1.4; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Grid lines -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- HEADER -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="100" height="24" rx="12" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <text x="50" y="16" text-anchor="middle" class="tag" fill="#38bdf8">GRAPHICAL ABSTRACT</text>
    <text x="115" y="17" class="subtitle" font-size="13px">| Open Scientific Intelligence (OSI) Hackathon</text>

    <text x="0" y="55" class="title" font-size="28px">PerturbMat: Epistemic Calibration &amp; Physical Invariant Enforcement</text>
    <text x="0" y="80" class="subtitle" font-size="15px">Decoupling Nanocrystal Morphology from Textbook Bias via Adversarial First-Principles Cross-Questioning</text>
  </g>

  <!-- 3-COLUMN ARCHITECTURE -->

  <!-- ==================== COLUMN 1: THE TRAP (LEFT) ==================== -->
  <g transform="translate(60, 150)">
    <rect width="330" height="475" rx="12" fill="url(#trapGrad)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" filter="url(#dropShadow)" />
    
    <!-- Header -->
    <rect x="20" y="20" width="120" height="22" rx="4" fill="#ef4444" fill-opacity="0.2" />
    <text x="80" y="35" text-anchor="middle" class="tag" fill="#f87171">MODE 1 &amp; 2 BASELINE</text>
    
    <text x="20" y="68" class="heading" fill="#fca5a5">The Literature Prior Trap</text>
    <text x="20" y="88" class="subtitle" font-size="12px">Single-Agent RAG &amp; Unstructured Groupthink</text>

    <!-- Narrative -->
    <rect x="20" y="105" width="290" height="75" rx="6" fill="#000000" fill-opacity="0.3" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="32" y="125" class="body" font-size="12px" fill="#fecaca">
      <tspan font-weight="700">Perturbation Tested:</tspan> Add [CTAB] 1 → 50 mM
    </text>
    <text x="32" y="145" class="body" font-size="12px" fill="#fda4af">
      <tspan font-weight="700">Naive Prior:</tspan> Recites classic nanorod papers:
    </text>
    <text x="32" y="165" class="code" font-size="11px" fill="#f87171">
      "Bromide increases Aspect Ratio → LSPR red-shifts"
    </text>

    <!-- Visual: Distorted Nanoparticle / Violation -->
    <g transform="translate(165, 255)">
      <!-- Massive swollen shape violating mass conservation -->
      <path d="M 0,-70 L 45,0 L 0,70 L -45,0 Z" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3" />
      <circle cx="0" cy="0" r="4" fill="#ef4444" />
      <text x="0" y="90" text-anchor="middle" class="tag" fill="#ef4444">MASS CONSERVATION VIOLATED</text>
      <text x="0" y="105" text-anchor="middle" class="code" font-size="11px" fill="#fca5a5">Volume explodes 300% (Impossible)</text>
    </g>

    <!-- Outcome Badges -->
    <g transform="translate(20, 395)">
      <rect width="290" height="60" rx="6" fill="#1e1014" stroke="#7f1d1d" stroke-width="1" />
      <text x="15" y="24" class="tag" fill="#ef4444">FAILED BENCHMARK METRICS</text>
      <text x="15" y="44" class="code" fill="#fca5a5">Brier Error: 0.7225 | Accuracy: 14–33%</text>
    </g>
  </g>


  <!-- ==================== COLUMN 2: THE ENGINE (CENTER) ==================== -->
  <g transform="translate(420, 150)">
    <rect width="360" height="475" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.8" filter="url(#dropShadow)" />

    <!-- Header -->
    <rect x="20" y="20" width="130" height="22" rx="4" fill="#38bdf8" fill-opacity="0.2" />
    <text x="85" y="35" text-anchor="middle" class="tag" fill="#38bdf8">OUR CORE INNOVATION</text>
    
    <text x="20" y="68" class="heading" fill="#e2e8f0">Dial-a-Skeptic &amp; Valency</text>
    <text x="20" y="88" class="subtitle" font-size="12px">Adversarial First-Principles Cross-Questioning</text>

    <!-- Debate Box 1: Proposer vs Skeptic -->
    <g transform="translate(20, 105)">
      <!-- Proposer -->
      <rect width="320" height="52" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <circle cx="20" cy="26" r="10" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" />
      <text x="20" y="30" text-anchor="middle" font-size="11px" font-weight="700" fill="#60a5fa">P</text>
      <text x="38" y="22" class="tag" fill="#93c5fd">1. Proposer Agent</text>
      <text x="38" y="38" class="body" font-size="11px" fill="#cbd5e1">Extracts causal CMO graph &amp; proposes hypothesis</text>

      <!-- Skeptic -->
      <g transform="translate(0, 60)">
        <rect width="320" height="110" rx="6" fill="#1e1b4b" fill-opacity="0.6" stroke="#818cf8" stroke-width="1.2" />
        <circle cx="20" cy="24" r="10" fill="#818cf8" fill-opacity="0.3" stroke="#818cf8" />
        <text x="20" y="28" text-anchor="middle" font-size="11px" font-weight="700" fill="#a5b4fc">S</text>
        <text x="38" y="20" class="tag" fill="#c7d2fe">2. First-Principles Invariant Skeptic</text>
        
        <text x="20" y="44" class="code" font-size="11px" fill="#e0e7ff">• Invariant 1: V ∝ W² L = const (Mass Balance)</text>
        <text x="20" y="62" class="code" font-size="11px" fill="#e0e7ff">• Invariant 2: E°([AuBr4]⁻) &lt; E°([AuCl4]⁻) (Redox)</text>
        <text x="20" y="80" class="code" font-size="11px" fill="#e0e7ff">• Invariant 3: CTA⁺/[AgBr2]⁻ passivates {112} tips</text>
        <text x="20" y="98" class="code" font-size="11px" fill="#a5b4fc">• Invariant 4: Active Contradiction Falsification</text>
      </g>
    </g>

    <!-- Valency MCP Engine Box -->
    <g transform="translate(20, 285)">
      <rect width="320" height="85" rx="6" fill="#042f2e" fill-opacity="0.8" stroke="#14b8a6" stroke-width="1.2" />
      <text x="15" y="22" class="tag" fill="#2dd4bf">3. Valency Bond MCP Integration</text>
      <text x="15" y="42" class="body" font-size="11px" fill="#ccfbf1">
        • 46.8M papers &amp; 534M citation edges queried in &lt;500 ms
      </text>
      <text x="15" y="58" class="body" font-size="11px" fill="#ccfbf1">
        • Uncovered Wang 2006 (CTEAB retardation) &amp; Facet anomalies
      </text>
      <text x="15" y="74" class="body" font-size="11px" fill="#5eead4">
        • Zero boilerplate noise (100% peer-reviewed abstracts)
      </text>
    </g>

    <!-- Arbiter Box -->
    <g transform="translate(20, 380)">
      <rect width="320" height="75" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="20" cy="22" r="10" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" />
      <text x="20" y="26" text-anchor="middle" font-size="11px" font-weight="700" fill="#fbbf24">A</text>
      <text x="38" y="20" class="tag" fill="#fde68a">4. Chief Synthesis Arbiter</text>
      <text x="15" y="44" class="body" font-size="11px" fill="#fef3c7">
        Overrules naive prior: Locks V=const, forces L↓, W↑, AR↓,
      </text>
      <text x="15" y="60" class="body" font-size="11px" fill="#fef3c7">
        predicts LSPR blueshift &amp; calibrated 10x kinetic slowdown.
      </text>
    </g>
  </g>


  <!-- ==================== COLUMN 3: THE DISCOVERY (RIGHT) ==================== -->
  <g transform="translate(810, 150)">
    <rect width="330" height="475" rx="12" fill="url(#solGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8" filter="url(#dropShadow)" />

    <!-- Header -->
    <rect x="20" y="20" width="130" height="22" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="85" y="35" text-anchor="middle" class="tag" fill="#34d399">VALIDATED DISCOVERY</text>
    
    <text x="20" y="68" class="heading" fill="#6ee7b7">Calibrated Wet-Lab Wisdom</text>
    <text x="20" y="88" class="subtitle" font-size="12px">Held-Out Wet-Lab Match (Small 2024)</text>

    <!-- Gold Nanobipyramid Morphology Rendering -->
    <g transform="translate(165, 215)">
      <!-- Background Glow -->
      <ellipse cx="0" cy="0" rx="60" ry="25" fill="#f59e0b" fill-opacity="0.15" filter="url(#goldGlow)" />

      <!-- Nanobipyramid 3D Facets -->
      <!-- Top Pyramid -->
      <polygon points="0,-55 24,0 0,6" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="0.8" />
      <polygon points="0,-55 0,6 -24,0" fill="url(#goldFacetDark)" stroke="#fef08a" stroke-width="0.8" />
      
      <!-- Bottom Pyramid -->
      <polygon points="0,55 24,0 0,6" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="0.8" />
      <polygon points="0,55 0,6 -24,0" fill="url(#goldFacetDark)" stroke="#fef08a" stroke-width="0.8" />

      <!-- Equatorial Twin Plane Highlight -->
      <ellipse cx="0" cy="0" rx="26" ry="6" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="3 2" />

      <!-- Invariant Annotation -->
      <text x="0" y="75" text-anchor="middle" class="tag" fill="#34d399">MASS CONSERVED: V ≈ 11,000 nm³</text>
      <text x="0" y="92" text-anchor="middle" class="body" font-size="11px" fill="#a7f3d0">Length 100→49 nm (↓) | Width 17→29 nm (↑)</text>
    </g>

    <!-- Plasmon Spectrum Shift -->
    <g transform="translate(25, 335)">
      <rect width="280" height="48" rx="6" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="1" />
      <text x="12" y="20" class="tag" fill="#6ee7b7">LSPR SPECTRAL PREDICTION</text>
      <text x="12" y="38" class="body" font-size="12px" fill="#d1fae5">
        <tspan font-weight="700" fill="#34d399">DRAMATIC BLUE-SHIFT:</tspan> 1070 nm → 584 nm (Δ = 486 nm)
      </text>
    </g>

    <!-- Calibration / Brier Score Badge -->
    <g transform="translate(20, 395)">
      <rect width="290" height="60" rx="6" fill="#022c22" stroke="#047857" stroke-width="1.2" />
      <text x="15" y="24" class="tag" fill="#10b981">PERFECT BENCHMARK CALIBRATION</text>
      <text x="15" y="44" class="code" font-size="13px" font-weight="700" fill="#a7f3d0">
        Brier Error: 0.0025 | Directional Acc: 94.4%
      </text>
    </g>
  </g>

  <!-- Connective Directional Arrows -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M 395, 387 L 415, 387" marker-end="url(#arrow)" />
    <path d="M 785, 387 L 805, 387" marker-end="url(#arrow)" />
  </g>
</svg>